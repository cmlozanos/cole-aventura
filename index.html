<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#355aca"><meta name="description" content="Matemáticas visuales y aleatorias para primero de Primaria. Sin anuncios ni cuentas.">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./public/icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./public/icons/icon-192.png">
  <link rel="stylesheet" href="./src/child.css"><link rel="stylesheet" href="./src/reading.css"><title>Cole Aventura · Primero de Primaria</title>
</head>
<body>
  <div id="boot-loader" role="status" aria-live="polite"><span class="loading-star" aria-hidden="true">✦</span><span class="sr-only">Preparando la aventura…</span></div>
  <header><div id="score" class="score" role="status" aria-live="polite" aria-label="0 puntos"><span aria-hidden="true">★</span><strong>0</strong></div><div class="controls" role="group" aria-label="Controles del juego"></div></header>
  <main id="main" tabindex="-1"></main>
  <dialog id="options" aria-labelledby="options-title"></dialog>
  <dialog id="transition" aria-label="Reto resuelto. Siguiente reto" aria-modal="true"><div class="transition-score" aria-label="Puntos de sesión"></div><div class="transition-card" tabindex="-1"><span class="transition-star" aria-hidden="true">★</span><h2>¡Bien!</h2><div class="transition-spinner" role="status" aria-label="Siguiente reto"></div></div></dialog>
  <script type="module" src="./src/bootstrap.js"></script>
</body>
</html>
